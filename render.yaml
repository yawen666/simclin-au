services:
  - type: web
    name: simclin-au-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data/simclin-au.db
      - key: JWT_SECRET
        generateValue: true
      - key: FACULTY_DEMO_ACCESS_CODE
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_REQUESTS_PER_HOUR
        value: 60
      - key: WEB_ORIGIN
        value: https://simclin-au-web.onrender.com
      - key: LOG_LEVEL
        value: info

  - type: web
    name: simclin-au-web
    runtime: static
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://simclin-au-api.onrender.com/api
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
