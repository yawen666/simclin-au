services:
  - type: web
    name: simclin-au-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data/simclin-au.db
      - key: JWT_SECRET
        generateValue: true
      - key: FACULTY_DEMO_ACCESS_CODE
        generateValue: true
      - key: FACULTY_DEMO_OPEN_ACCESS
        value: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_REQUESTS_PER_HOUR
        value: 60
      - key: AI_REQUESTS_PER_IP_PER_HOUR
        value: 180
      - key: AI_GLOBAL_REQUESTS_PER_HOUR
        value: 360
      - key: AUTH_REQUESTS_PER_IP_PER_HOUR
        value: 120
      - key: AUTH_GLOBAL_REQUESTS_PER_HOUR
        value: 1200
      - key: ANONYMOUS_PROFILES_PER_IP_PER_HOUR
        value: 20
      - key: ANONYMOUS_PROFILES_GLOBAL_PER_HOUR
        value: 200
      - key: MAX_ANONYMOUS_STUDENT_PROFILES
        value: 5000
      - key: SESSION_REQUESTS_PER_USER_PER_HOUR
        value: 60
      - key: SESSION_REQUESTS_PER_IP_PER_HOUR
        value: 240
      - key: SESSION_GLOBAL_REQUESTS_PER_HOUR
        value: 1000
      - key: SESSION_STARTS_PER_USER_PER_HOUR
        value: 30
      - key: SESSION_STARTS_PER_IP_PER_HOUR
        value: 120
      - key: SESSION_STARTS_GLOBAL_PER_HOUR
        value: 500
      - key: MAX_SESSIONS_PER_STUDENT
        value: 100
      - key: MAX_TOTAL_SESSIONS
        value: 50000
      - key: WEB_ORIGIN
        value: https://simclin-au-web.onrender.com
      - key: LOG_LEVEL
        value: info

  - type: web
    name: simclin-au-web
    runtime: static
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://simclin-au-api.onrender.com/api
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
