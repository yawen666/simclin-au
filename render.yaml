services:
  - type: web
    name: simclin-au-api
    runtime: node
    plan: free
    rootDir: server
    # Render may set NODE_ENV=production during the image build. Keep dev
    # dependencies available here because TypeScript and its type definitions
    # are required to compile the server before the production start command.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data/simclin-au.db
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: AI_PROVIDER
        value: deepseek
      - key: WEB_ORIGIN
        value: https://simclin-au-web.onrender.com
      - key: LOG_LEVEL
        value: info

  - type: web
    name: simclin-au-web
    runtime: static
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://simclin-au-api.onrender.com/api
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
